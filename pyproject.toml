[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ftl-reasons-wiki"
version = "0.1.0"
description = "Static wiki generator for EEM belief networks"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
llm = ["ftl-reasons"]

[tool.uv.sources]
ftl-reasons = { path = "../ftl-reasons", editable = true }

[project.scripts]
eem-wiki = "eem_wiki.cli:cli"
